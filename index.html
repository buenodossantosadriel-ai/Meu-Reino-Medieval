<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#18251d"><link rel="manifest" href="/manifest.json"><title>Meu Reino Medieval</title><style>
*{box-sizing:border-box}body{margin:0;background:#18251d;color:#f7f1df;font:15px system-ui;overflow:hidden}#game{position:fixed;inset:0}canvas{display:block}#hud{position:fixed;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;padding:12px;gap:8px}.panel{background:#142019d9;border:1px solid #b99b59;border-radius:12px;padding:9px 12px;box-shadow:0 3px 14px #0005}.brand{font-weight:800;color:#f0cc78}.bottom{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:8px;pointer-events:auto}button{border:1px solid #c5a96b;background:#293b2d;color:#fff2d0;border-radius:10px;padding:11px 14px;font-weight:700}button:active{transform:scale(.96)}#login{position:fixed;inset:0;background:#101a15eF;display:grid;place-items:center;z-index:5}#login form{width:min(90vw,360px);background:#26382b;border:1px solid #c5a96b;border-radius:16px;padding:22px}input{width:100%;padding:12px;margin:7px 0 12px;border-radius:8px;border:1px solid #b99b59;background:#101a15;color:white}#hint{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#142019cc;padding:8px 12px;border-radius:9px}.hidden{display:none}@media(min-width:700px){.bottom{left:auto;right:16px;bottom:20px;width:260px;justify-content:flex-end}}
</style></head><body><div id="game"></div><div id="hud"><div class="top"><div class="panel"><div class="brand">⚔ MEU REINO MEDIEVAL</div><div id="stats">Madeira: 0 · Pedra: 0</div></div><div class="panel" id="players">Entrando no reino…</div></div><div id="hint">WASD ou controles para caminhar · Explore o reino!</div><div class="bottom"><button id="forward">▲</button><button id="left">◀</button><button id="back">▼</button><button id="right">▶</button><button id="collect">🌲 Coletar</button><button id="build">🧱 Construir</button><button id="attack">⚔ Atacar</button></div></div>
<div id="login"><form id="auth"><h2>Entre no seu reino</h2><p>Use seu e-mail para salvar seu progresso.</p><input id="email" type="email" placeholder="E-mail" required><input id="password" type="password" placeholder="Senha (mín. 6 caracteres)" minlength="6" required><button style="width:100%">Entrar / Criar conta</button><p id="authmsg"></p></form></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SUPABASE_URL='https://vuvjxrxljlhvoldugmpz.supabase.co';
const SUPABASE_KEY='sb_publishable_Rr0gZu8e2g7uLLSBugM2aA_93T5xOVY';
const db=createClient(SUPABASE_URL,SUPABASE_KEY);
let user=null,wood=0,stone=0;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bc9dc);scene.fog=new THREE.Fog(0x9bc9dc,35,100);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,200);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.querySelector('#game').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe5f4ff,0x65733d,2));const sun=new THREE.DirectionalLight(0xffedc4,2.2);sun.position.set(-15,30,15);sun.castShadow=true;scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(180,180),new THREE.MeshStandardMaterial({color:0x548344,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const grid=new THREE.GridHelper(180,60,0x496b3d,0x496b3d);grid.position.y=.015;scene.add(grid);
function box(x,y,z,sx,sy,sz,color){const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),new THREE.MeshStandardMaterial({color}));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m}
function tree(x,z){const trunk= new THREE.Mesh(new THREE.CylinderGeometry(.22,.3,1.5,6),new THREE.MeshStandardMaterial({color:0x76502c}));trunk.position.set(x,.75,z);scene.add(trunk);const crown=new THREE.Mesh(new THREE.ConeGeometry(1.25,2.8,7),new THREE.MeshStandardMaterial({color:0x27633a}));crown.position.set(x,2.65,z);scene.add(crown)}
for(let i=0;i<55;i++){const x=(Math.random()-.5)*90,z=(Math.random()-.5)*90;if(Math.abs(x)>7||Math.abs(z)>7)tree(x,z)}
// Castelo inicial
for(let x=-4;x<=4;x+=2)for(let z=-4;z<=4;z+=2)if(Math.abs(x)===4||Math.abs(z)===4)box(x,1,z,1.9,2,1.9,0x9b9585);
box(0,1.8,-4,2.2,3.6,2,0xaaa18c);
const player=new THREE.Group();const body=new THREE.Mesh(new THREE.CapsuleGeometry(.42,.8,4,8),new THREE.MeshStandardMaterial({color:0x315c9a}));body.position.y=.85;player.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.28,12,10),new THREE.MeshStandardMaterial({color:0xe0b68d}));head.position.y=1.55;player.add(head);scene.add(player);
let yaw=0;const keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
const held={};for(const [id,key] of [['forward','w'],['back','s'],['left','a'],['right','d']]){const b=document.getElementById(id);b.onpointerdown=()=>held[key]=true;b.onpointerup=b.onpointerleave=()=>held[key]=false}
function updateStats(){document.querySelector('#stats').textContent='Madeira: '+wood+' · Pedra: '+stone}
document.querySelector('#collect').onclick=()=>{wood+=1;stone+=1;updateStats();document.querySelector('#hint').textContent='Você coletou madeira e pedra!'}
document.querySelector('#build').onclick=()=>{if(wood<3||stone<2){document.querySelector('#hint').textContent='Precisa de 3 madeiras e 2 pedras.';return}wood-=3;stone-=2;box(player.position.x,1,player.position.z-2,2,2,2,0x8e8b83);updateStats()}
document.querySelector('#attack').onclick=()=>{document.querySelector('#hint').textContent='Você brandiu sua espada!'}
const channel=()=>db.channel('world-live').on('presence',{event:'sync'},()=>{document.querySelector('#players').textContent='Online: '+Object.keys(channel.presenceState()).length}).subscribe(async status=>{if(status==='SUBSCRIBED'&&user)await channel.track({name:user.email.split('@')[0]})});
let live;
document.querySelector('#auth').onsubmit=async e=>{e.preventDefault();const msg=document.querySelector('#authmsg');msg.textContent='Conectando…';const email=document.querySelector('#email').value,password=document.querySelector('#password').value;let r=await db.auth.signInWithPassword({email,password});if(r.error&&r.error.message.toLowerCase().includes('invalid login'))r=await db.auth.signUp({email,password});if(r.error){msg.textContent=r.error.message;return}user=r.data.user;if(!user){msg.textContent='Confirme seu e-mail e depois entre.';return}document.querySelector('#login').classList.add('hidden');live=db.channel('world-live').on('presence',{event:'sync'},()=>{document.querySelector('#players').textContent='Online: '+Object.keys(live.presenceState()).length}).subscribe(async s=>{if(s==='SUBSCRIBED')await live.track({name:email.split('@')[0]})});const {data}=await db.from('players').select('*').eq('user_id',user.id).maybeSingle();if(data){player.position.set(data.x||0,0,data.z||0);wood=data.wood||0;stone=data.stone||0;updateStats()}};
let last=0;function animate(t){requestAnimationFrame(animate);const dt=Math.min((t-last)/1000,.05);last=t;let dx=0,dz=0;if(keys.w||keys.arrowup||held.w)dz-=1;if(keys.s||keys.arrowdown||held.s)dz+=1;if(keys.a||keys.arrowleft||held.a)dx-=1;if(keys.d||keys.arrowright||held.d)dx+=1;const len=Math.hypot(dx,dz)||1;player.position.x+=dx/len*6*dt;player.position.z+=dz/len*6*dt;if(dx||dz)player.rotation.y=Math.atan2(dx,dz);camera.position.lerp(new THREE.Vector3(player.position.x,player.position.y+5,player.position.z+9),.08);camera.lookAt(player.position.x,1,player.position.z);renderer.render(scene,camera);if(user&&t%3000<20)db.from('players').upsert({user_id:user.id,player_name:user.email.split('@')[0],x:player.position.x,y:0,z:player.position.z,health:100,stamina:100,wood,stone,updated_at:new Date().toISOString()})}
requestAnimationFrame(animate);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');
</script></body></html>
