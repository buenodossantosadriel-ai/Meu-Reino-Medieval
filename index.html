<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#18251d"><link rel="manifest" href="/manifest.json"><title>Meu Reino Medieval</title><style>
*{box-sizing:border-box}body{margin:0;background:#18251d;color:#f7f1df;font:15px system-ui;overflow:hidden}#game{position:fixed;inset:0}canvas{display:block}#hud{position:fixed;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;padding:12px;gap:8px}.panel{background:#142019d9;border:1px solid #b99b59;border-radius:12px;padding:9px 12px;box-shadow:0 3px 14px #0005}.brand{font-weight:800;color:#f0cc78}.bottom{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:8px;pointer-events:auto}button{border:1px solid #c5a96b;background:#293b2d;color:#fff2d0;border-radius:10px;padding:11px 14px;font-weight:700}button:active{transform:scale(.96)}#login{position:fixed;inset:0;background:#101a15eF;display:grid;place-items:center;z-index:5}#login form{width:min(90vw,360px);background:#26382b;border:1px solid #c5a96b;border-radius:16px;padding:22px}input{width:100%;padding:12px;margin:7px 0 12px;border-radius:8px;border:1px solid #b99b59;background:#101a15;color:white}#chatbox input{margin:4px 0}#hint{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#142019cc;padding:8px 12px;border-radius:9px}.hidden{display:none}@media(min-width:700px){.bottom{left:auto;right:16px;bottom:20px;width:260px;justify-content:flex-end}}
</style></head><body><div id="game"></div><div id="hud"><div class="top"><div class="panel"><div class="brand">⚔ MEU REINO MEDIEVAL</div><div id="stats">Madeira: 0 · Pedra: 0</div></div><div class="panel" id="players">Entrando no reino…</div></div><div id="hint">WASD ou controles para caminhar · Explore o reino!</div><div class="bottom"><button id="forward">▲</button><button id="left">◀</button><button id="back">▼</button><button id="right">▶</button><button id="collect">🌲 Coletar</button><button id="build">🧱 Construir</button><button id="attack">⚔ Atacar</button><button id="plant">🌱 Plantar</button><button id="animal">🐑 Animal</button><button id="chatToggle">💬 Chat</button></div></div><div id="chatbox" class="panel hidden" style="position:fixed;right:12px;bottom:82px;width:min(92vw,320px);pointer-events:auto;z-index:3"><b>Chat do reino</b><div id="chatlog" style="height:150px;overflow:auto;margin:8px 0;font-size:13px"></div><form id="chatform"><input id="chatinput" maxlength="500" placeholder="Mensagem..." required><button>Enviar</button></form></div>
<div id="login"><form id="auth"><h2>Entre no seu reino</h2><p>Use seu e-mail para salvar seu progresso.</p><input id="email" type="email" placeholder="E-mail" required><input id="password" type="password" placeholder="Senha (mín. 6 caracteres)" minlength="6" required><button style="width:100%">Entrar / Criar conta</button><p id="authmsg"></p></form></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SUPABASE_URL='https://vuvjxrxljlhvoldugmpz.supabase.co';
const SUPABASE_KEY='sb_publishable_Rr0gZu8e2g7uLLSBugM2aA_93T5xOVY';
const db=createClient(SUPABASE_URL,SUPABASE_KEY);
let user=null,wood=0,stone=0,health=100,night=false,lastSave=0;const meshes={blocks:new Map(),trees:new Map(),animals:new Map()};
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bc9dc);scene.fog=new THREE.Fog(0x9bc9dc,35,100);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,200);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.querySelector('#game').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe5f4ff,0x65733d,2));const sun=new THREE.DirectionalLight(0xffedc4,2.2);sun.position.set(-15,30,15);sun.castShadow=true;scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(180,180),new THREE.MeshStandardMaterial({color:0x548344,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const grid=new THREE.GridHelper(180,60,0x496b3d,0x496b3d);grid.position.y=.015;scene.add(grid);
function box(x,y,z,sx,sy,sz,color){const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),new THREE.MeshStandardMaterial({color}));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m}
function tree(x,z,id=null){const group=new THREE.Group();const trunk= new THREE.Mesh(new THREE.CylinderGeometry(.22,.3,1.5,6),new THREE.MeshStandardMaterial({color:0x76502c}));trunk.position.set(0,.75,0);group.add(trunk);const crown=new THREE.Mesh(new THREE.ConeGeometry(1.25,2.8,7),new THREE.MeshStandardMaterial({color:0x27633a}));crown.position.set(0,2.65,0);group.add(crown);group.position.set(x,0,z);scene.add(group);if(id)meshes.trees.set(id,group);return group}
for(let i=0;i<55;i++){const x=(Math.random()-.5)*90,z=(Math.random()-.5)*90;if(Math.abs(x)>7||Math.abs(z)>7)tree(x,z)}
// Castelo inicial
for(let x=-4;x<=4;x+=2)for(let z=-4;z<=4;z+=2)if(Math.abs(x)===4||Math.abs(z)===4)box(x,1,z,1.9,2,1.9,0x9b9585);
box(0,1.8,-4,2.2,3.6,2,0xaaa18c);
const player=new THREE.Group();const body=new THREE.Mesh(new THREE.CapsuleGeometry(.42,.8,4,8),new THREE.MeshStandardMaterial({color:0x315c9a}));body.position.y=.85;player.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.28,12,10),new THREE.MeshStandardMaterial({color:0xe0b68d}));head.position.y=1.55;player.add(head);scene.add(player);
let yaw=0;const keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
const held={};for(const [id,key] of [['forward','w'],['back','s'],['left','a'],['right','d']]){const b=document.getElementById(id);b.onpointerdown=()=>held[key]=true;b.onpointerup=b.onpointerleave=()=>held[key]=false}
function updateStats(){document.querySelector('#stats').textContent='❤️ '+health+' · Madeira: '+wood+' · Pedra: '+stone}
async function saveResources(){if(!user)return;await db.from('players').upsert({user_id:user.id,player_name:user.email.split('@')[0],x:player.position.x,y:0,z:player.position.z,health,stamina:100,wood,stone,updated_at:new Date().toISOString()})}
document.querySelector('#collect').onclick=async()=>{wood+=1;stone+=1;updateStats();await saveResources();document.querySelector('#hint').textContent='Recursos coletados (ação demonstrativa).'}

document.querySelector('#build').onclick=async()=>{if(!user)return;if(wood<3||stone<2){document.querySelector('#hint').textContent='Precisa de 3 madeiras e 2 pedras.';return}const x=Math.round(player.position.x/2)*2,z=Math.round((player.position.z-2)/2)*2;const {data,error}=await db.from('world_blocks').insert({owner_id:user.id,block_type:'stone',x,y:1,z,rotation:0}).select().single();if(error){document.querySelector('#hint').textContent='Falha ao salvar construção: '+error.message;return}wood-=3;stone-=2;updateStats();renderBlock(data);await saveResources()}; 
function renderBlock(b){if(meshes.blocks.has(b.id))return;const m=box(b.x,b.y,b.z,2,2,2,b.block_type==='wood'?0x80542f:0x8e8b83);meshes.blocks.set(b.id,m)}
function renderTree(t){if(meshes.trees.has(t.id))return;tree(t.x,t.z,t.id)}
function renderAnimal(a){if(meshes.animals.has(a.id))return;const colors={cow:0xeee6d5,pig:0xe7a1a1,chicken:0xf4e8bb,sheep:0xe9e6dc};const g=new THREE.Group();const body=new THREE.Mesh(new THREE.BoxGeometry(.9,.65,1.2),new THREE.MeshStandardMaterial({color:colors[a.animal_type]||0xffffff}));body.position.y=.65;g.add(body);const head=new THREE.Mesh(new THREE.BoxGeometry(.45,.45,.45),new THREE.MeshStandardMaterial({color:colors[a.animal_type]||0xffffff}));head.position.set(0,.85,.65);g.add(head);g.position.set(a.x,0,a.z);scene.add(g);meshes.animals.set(a.id,g)}
document.querySelector('#plant').onclick=async()=>{if(!user)return;const x=player.position.x+Math.sin(player.rotation.y)*-3,z=player.position.z+Math.cos(player.rotation.y)*-3;const {data,error}=await db.from('world_trees').insert({owner_id:user.id,tree_type:'oak',x,y:0,z,growth_seconds:60,health:100}).select().single();if(error){document.querySelector('#hint').textContent=error.message;return}renderTree(data);document.querySelector('#hint').textContent='Muda plantada! Crescimento previsto: 60 segundos.'};
document.querySelector('#animal').onclick=async()=>{if(!user)return;const types=['cow','pig','chicken','sheep'];const animal_type=types[Math.floor(Math.random()*types.length)];const {data,error}=await db.from('world_animals').insert({owner_id:user.id,animal_type,x:player.position.x+2,y:0,z:player.position.z+2,state:{}}).select().single();if(error){document.querySelector('#hint').textContent=error.message;return}renderAnimal(data);document.querySelector('#hint').textContent='Animal criado: '+animal_type};
document.querySelector('#chatToggle').onclick=()=>document.querySelector('#chatbox').classList.toggle('hidden');
async function loadWorld(){const [b,t,a,ch]=await Promise.all([db.from('world_blocks').select('*'),db.from('world_trees').select('*'),db.from('world_animals').select('*'),db.from('world_chat').select('*').order('created_at',{ascending:false}).limit(30)]);(b.data||[]).forEach(renderBlock);(t.data||[]).forEach(renderTree);(a.data||[]).forEach(renderAnimal);(ch.data||[]).reverse().forEach(showChat)}
function showChat(m){const log=document.querySelector('#chatlog');const line=document.createElement('div');line.textContent=m.player_name+': '+m.message;log.appendChild(line);log.scrollTop=log.scrollHeight}
document.querySelector('#chatform').onsubmit=async e=>{e.preventDefault();const input=document.querySelector('#chatinput');const message=input.value.trim();if(!message||!user)return;const {data,error}=await db.from('world_chat').insert({user_id:user.id,player_name:user.email.split('@')[0],message}).select().single();if(error){document.querySelector('#hint').textContent=error.message;return}showChat(data);input.value=''};
function subscribeWorld(){db.channel('world-changes').on('postgres_changes',{event:'INSERT',schema:'public',table:'world_blocks'},p=>renderBlock(p.new)).on('postgres_changes',{event:'INSERT',schema:'public',table:'world_trees'},p=>renderTree(p.new)).on('postgres_changes',{event:'INSERT',schema:'public',table:'world_animals'},p=>renderAnimal(p.new)).on('postgres_changes',{event:'INSERT',schema:'public',table:'world_chat'},p=>{if(p.new.user_id!==user?.id)showChat(p.new)}).subscribe()}

document.querySelector('#attack').onclick=()=>{document.querySelector('#hint').textContent='Você brandiu sua espada! Os inimigos ainda serão adicionados.'}
const channel=()=>db.channel('world-live').on('presence',{event:'sync'},()=>{document.querySelector('#players').textContent='Online: '+Object.keys(channel.presenceState()).length}).subscribe(async status=>{if(status==='SUBSCRIBED'&&user)await channel.track({name:user.email.split('@')[0]})});
let live;
async function enterGame(session,emailFallback='') {
  user=session.user;
  if(!user) throw new Error('Sessão não encontrada. Entre novamente com seu e-mail e senha.');
  document.querySelector('#login').classList.add('hidden');
  document.querySelector('#players').textContent='Carregando reino…';
  try {
    await loadWorld();
    subscribeWorld();
    if(live) await db.removeChannel(live);
    live=db.channel('world-live').on('presence',{event:'sync'},()=> {
      const count=Object.keys(live.presenceState()).length;
      document.querySelector('#players').textContent='Online: '+count;
    }).subscribe(async status=>{
      if(status==='SUBSCRIBED'&&user) {
        await live.track({name:(user.email||emailFallback||'Jogador').split('@')[0]});
      }
    });
    const {data,error}=await db.from('players').select('*').eq('user_id',user.id).maybeSingle();
    if(error) throw error;
    if(data) {
      player.position.set(data.x||0,0,data.z||0);
      wood=data.wood||0; stone=data.stone||0; health=data.health||100; updateStats();
    } else await saveResources();
    document.querySelector('#hint').textContent='Bem-vindo ao reino! Explore e construa.';
  } catch(err) {
    document.querySelector('#login').classList.remove('hidden');
    document.querySelector('#authmsg').textContent='Acesso confirmado, mas houve falha ao carregar o mundo: '+(err.message||err);
    throw err;
  }
}

document.querySelector('#auth').onsubmit=async e=>{
  e.preventDefault();
  const msg=document.querySelector('#authmsg');
  const button=document.querySelector('#auth button');
  const email=document.querySelector('#email').value.trim();
  const password=document.querySelector('#password').value;
  button.disabled=true; msg.textContent='Conectando à sua conta…';
  try {
    let result=await Promise.race([
      db.auth.signInWithPassword({email,password}),
      new Promise((_,reject)=>setTimeout(()=>reject(new Error('A conexão demorou mais de 20 segundos. Verifique sua internet e tente novamente.')),20000))
    ]);
    if(result.error && /invalid login credentials|invalid login/i.test(result.error.message)) {
      msg.textContent='Conta não encontrada ou senha incorreta. Se você já confirmou o e-mail, confira a senha e tente novamente.';
      return;
    }
    if(result.error) throw result.error;
    if(!result.data.session) {
      msg.textContent='Sua conta ainda não possui uma sessão ativa. Confirme o e-mail pelo link mais recente e depois entre novamente.';
      return;
    }
    await enterGame(result.data.session,email);
  } catch(err) {
    msg.textContent='Não foi possível entrar: '+(err.message||String(err));
  } finally { button.disabled=false; }
};

// Se o link de confirmação já criou uma sessão, entra automaticamente no jogo.
db.auth.getSession().then(async ({data,error})=>{
  if(error) { document.querySelector('#authmsg').textContent='Falha ao verificar sessão: '+error.message; return; }
  if(data.session) {
    document.querySelector('#authmsg').textContent='Confirmação recebida. Abrindo seu reino…';
    try { await enterGame(data.session); } catch(_) {}
  }
});

let last=0;function animate(t){requestAnimationFrame(animate);const dt=Math.min((t-last)/1000,.05);last=t;let dx=0,dz=0;if(keys.w||keys.arrowup||held.w)dz-=1;if(keys.s||keys.arrowdown||held.s)dz+=1;if(keys.a||keys.arrowleft||held.a)dx-=1;if(keys.d||keys.arrowright||held.d)dx+=1;const len=Math.hypot(dx,dz)||1;player.position.x+=dx/len*6*dt;player.position.z+=dz/len*6*dt;if(dx||dz)player.rotation.y=Math.atan2(dx,dz);camera.position.lerp(new THREE.Vector3(player.position.x,player.position.y+5,player.position.z+9),.08);camera.lookAt(player.position.x,1,player.position.z);renderer.render(scene,camera);if(user&&t-lastSave>4000){lastSave=t;saveResources()}}
requestAnimationFrame(animate);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');
</script></body></html>
