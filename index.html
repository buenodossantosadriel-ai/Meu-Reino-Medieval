async function saveResources(){
  if(!user)return {error:null};
  try {
    // A identidade vem da sessão validada pelo signInWithPassword.
    const verifiedUser=user;
    if(!verifiedUser?.id) throw new Error('Sessão expirada. Entre novamente.');
    const payload={
      user_id:verifiedUser.id,
      player_name:(verifiedUser.email||'Jogador').split('@')[0].slice(0,24),
      x:player.position.x,y:0,z:player.position.z,health,stamina:100,wood,stone,
      updated_at:new Date().toISOString()
    };
    // Atualiza primeiro: evita o caminho INSERT desnecessário do upsert.
    const updated=await db.from('players').update(payload).eq('user_id',verifiedUser.id).select('user_id').maybeSingle();
    if(updated.error) throw updated.error;
    if(!updated.data){
      const inserted=await db.from('players').insert(payload);
      if(inserted.error) throw inserted.error;
    }
    return {error:null};
  } catch(error) {
    console.error('Falha ao salvar jogador:',error);
    return {error};
  }
}

async function loadWorld(){
  const jobs=[
    ['construções',db.from('world_blocks').select('*')],
    ['árvores',db.from('world_trees').select('*')],
    ['animais',db.from('world_animals').select('*')],
    ['chat',db.from('world_chat').select('*').order('created_at',{ascending:false}).limit(30)]
  ];
  const results=await Promise.all(jobs.map(async ([name,query])=>{
    try { const result=await query; if(result.error) throw result.error; return {name,data:result.data||[]}; }
    catch(error){ console.error('Falha ao carregar '+name,error); return {name,error}; }
  }));
  for(const r of results){
    if(r.error) continue;
    if(r.name==='construções') r.data.forEach(renderBlock);
    if(r.name==='árvores') r.data.forEach(renderTree);
    if(r.name==='animais') r.data.forEach(renderAnimal);
    if(r.name==='chat') r.data.reverse().forEach(showChat);
  }
  return results.filter(r=>r.error).map(r=>r.name);
}

function subscribeWorld(){
  if(worldChannel) return worldChannel;
  const ch=db.channel('world-changes');
  ch
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'world_blocks'},p=>renderBlock(p.new))
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'world_trees'},p=>renderTree(p.new))
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'world_animals'},p=>renderAnimal(p.new))
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'world_chat'},p=>{if(p.new.user_id!==user?.id)showChat(p.new)})
    .subscribe(status=>{
      if(status==='CHANNEL_ERROR'||status==='TIMED_OUT') {
        console.error('Realtime do mundo:',status);
        document.querySelector('#hint').textContent='Mundo carregado; sincronização ao vivo indisponível no momento.';
      }
    });
  worldChannel=ch;
  return ch;
}

document.querySelector('#attack').onclick=()=>{document.querySelector('#hint').textContent='Você brandiu sua espada! Os inimigos ainda serão adicionados.'}
let live;
async function enterGame(session,emailFallback='') {
  if(!session?.user) throw new Error('Sessão não encontrada. Entre novamente com seu e-mail e senha.');
  // signInWithPassword já devolveu uma sessão autenticada pelo Supabase.
  // Evita uma segunda chamada de rede que podia deixar a tela presa em "Conectando".
  user=session.user;
  const login=document.querySelector('#login');
  const players=document.querySelector('#players');
  const hint=document.querySelector('#hint');
  const timeout=(promise,ms,label)=>Promise.race([promise,new Promise((_,reject)=>setTimeout(()=>reject(new Error(label+' demorou mais que '+Math.round(ms/1000)+' segundos')),ms))]);
  // A sessão é válida: abrir o cenário antes das consultas opcionais.
  login.classList.add('hidden');
  players.textContent='Entrando no reino…';
  hint.textContent='Reino aberto. Carregando seus dados salvos…';
  try {
    subscribeWorld();
    if(!live) {
      live=db.channel('world-live');
      live.on('presence',{event:'sync'},()=>{
        players.textContent='Online: '+Object.keys(live.presenceState()).length;
      }).subscribe(async status=>{
        if(status==='SUBSCRIBED'&&user) {
          try { await live.track({name:(user.email||emailFallback||'Jogador').split('@')[0]}); }
          catch(e) { console.warn('Presence:',e); }
        }
      });
    }
    try {
      const failedTables=await timeout(loadWorld(),12000,'Carregamento do mundo');
      if(failedTables.length) hint.textContent='Reino aberto. Dados temporariamente indisponíveis: '+failedTables.join(', ');
    } catch(e) {
      console.warn('Carga do mundo:',e);
      hint.textContent='Reino aberto. A conexão com os dados está lenta; você já pode explorar.';
    }
    try {
      const result=await timeout(db.from('players').select('*').eq('user_id',user.id).maybeSingle(),10000,'Perfil do jogador');
      if(result.error) throw result.error;
      if(result.data) {
        player.position.set(Number(result.data.x)||0,0,Number(result.data.z)||0);
        wood=Number(result.data.wood)||0; stone=Number(result.data.stone)||0;
        health=Number(result.data.health)||100; updateStats();
      } else {
        const saved=await timeout(saveResources(),8000,'Salvamento inicial');
        if(saved.error) throw saved.error;
      }
      hint.textContent='Bem-vindo ao reino! Explore e construa.';
    } catch(e) {
      console.error('Perfil/salvamento:',e);
      hint.textContent='Reino aberto. Não foi possível carregar/salvar seu progresso agora: '+(e.message||e);
    }
    players.textContent=players.textContent.startsWith('Online:')?players.textContent:'Reino aberto';
    return true;
  } catch(err) {
    console.error('Falha ao iniciar reino:',err);
    login.classList.add('hidden');
    players.textContent='Reino aberto';
    hint.textContent='Reino aberto com recursos limitados: '+(err?.message||String(err));
    return true;
  }
}

document.querySelector('#auth').onsubmit=async e=>{
  e.preventDefault();
  const msg=document.querySelector('#authmsg');
  const button=document.querySelector('#auth button');
  const email=document.querySelector('#email').value.trim();
  const password=document.querySelector('#password').value;
  button.disabled=true; msg.textContent='Conectando à sua conta…';
  try {
    let result=await Promise.race([
      db.auth.signInWithPassword({email,password}),
      new Promise((_,reject)=>setTimeout(()=>reject(new Error('A conexão demorou mais de 20 segundos. Verifique sua internet e tente novamente.')),20000))
    ]);
    if(result.error && /invalid login credentials|invalid login/i.test(result.error.message)) {
      msg.textContent='Conta não encontrada ou senha incorreta. Se você já confirmou o e-mail, confira a senha e tente novamente.';
      return;
    }
    if(result.error) throw result.error;
    if(!result.data.session) {
      msg.textContent='Sua conta ainda não possui uma sessão ativa. Confirme o e-mail pelo link mais recente e depois entre novamente.';
      return;
    }
    msg.textContent='Conta autenticada. Abrindo o cenário…';
    await enterGame(result.data.session,email);
  } catch(err) {
    msg.textContent='Não foi possível entrar: '+(err.message||String(err));
  } finally { button.disabled=false; }
};

// Se o link de confirmação já criou uma sessão, entra automaticamente no jogo.
db.auth.getSession().then(async ({data,error})=>{
  if(error) { document.querySelector('#authmsg').textContent='Falha ao verificar sessão: '+error.message; return; }
  if(data.session) {
    document.querySelector('#authmsg').textContent='Confirmação recebida. Abrindo seu reino…';
    try { await enterGame(data.session); } catch(_) {}
  }
});

let last=0;function animate(t){requestAnimationFrame(animate);const dt=Math.min((t-last)/1000,.05);last=t;
 let sx=moveInput.x,sy=-moveInput.y;
 if(keys.w||keys.arrowup)sy=1;if(keys.s||keys.arrowdown)sy=-1;if(keys.a||keys.arrowleft)sx=-1;if(keys.d||keys.arrowright)sx=1;
 const len=Math.hypot(sx,sy);if(len>.08){const side=sx/Math.max(1,len),forward=sy/Math.max(1,len);
 const dx=(Math.sin(yaw)*forward+Math.cos(yaw)*side),dz=(-Math.cos(yaw)*forward+Math.sin(yaw)*side);
 player.position.x+=dx*6*dt;player.position.z+=dz*6*dt;player.rotation.y=Math.atan2(dx,dz);}
 const horiz=Math.cos(cameraPitch)*cameraDistance;
 const target=new THREE.Vector3(player.position.x+Math.sin(yaw)*horiz,player.position.y+Math.sin(cameraPitch)*cameraDistance+1.2,player.position.z+Math.cos(yaw)*horiz);
 camera.position.lerp(target,.14);camera.lookAt(player.position.x,1.1,player.position.z);
 renderer.render(scene,camera);if(user&&t-lastSave>4000){lastSave=t;saveResources()}}
requestAnimationFrame(animate);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
